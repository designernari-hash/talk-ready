<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Talk Ready">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Talk Ready</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Talk Ready</h1>
      <p class="sub">IF Design Academy · 토론 표현 미리 익히기 · v7</p>
    </div>
    <div class="top-actions">
      <button id="settings-toggle" class="icon-btn" aria-label="목소리 설정">🔊</button>
      <button id="theme-toggle" class="icon-btn" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <main>
    <section id="view-study" class="view"></section>
    <section id="view-phrases" class="view" hidden></section>
    <section id="view-qa" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabs">
    <button data-view="study" class="active">학습</button>
    <button data-view="phrases">표현집</button>
    <button data-view="qa">강사 질문</button>
  </nav>

  <script src="data.js?v=7"></script>
  <script src="audio.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
